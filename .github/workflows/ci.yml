name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile app.py tests/test_extractors.py
      - run: python -m pytest -q
      - name: Check frontend JavaScript
        shell: bash
        run: sed -n '/^  <script>/,/^  <\/script>/p' static/index.html | sed '1d;$d' | node --check

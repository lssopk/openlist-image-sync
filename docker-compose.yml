services:
  openlist-image-sync:
    build: .
    container_name: openlist-image-sync
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/session', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
